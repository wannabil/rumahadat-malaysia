    if(H.longhouse){const s=box(sg,.35,Math.hypot(fy,1.4),.35,0x6b4a2b,sx,fy/2,z0+.7);s.rotation.x=-Math.atan2(1.4,fy);for(let i=1;i<6;i++)box(sg,.4,.06,.12,0x3a2614,sx,i*fy/6,z0+1.4-i*1.4/6)}
    else{const n=5;for(let i=0;i<n;i++)box(sg,1.2,.08,.32,0x6b4a2b,sx,(i+1)*fy/(n+.5),z0+.35+(n-1-i)*.3);
      [-.62,.62].forEach(dx=>{const r=box(sg,.08,Math.hypot(fy,1.7),.14,0x5a3a20,sx+dx,fy/2,z0+.95);r.rotation.x=-Math.atan2(1.6,fy)})}
  }
  // roof
  const rg=part(H.extras.includes('limas')?'limas':'bumbung',[0,2.6,0]); const ry=top;
  if(H.roof.type==='hip'){const m=hipRoof(L,D,H.roof.h,H.roof.oh,H.roof.color);m.position.y=ry;rg.add(m)}
  else{
    [1,-1].forEach(s=>{const m=roofSide(L,D/2,H.roof.h,H.roof.oh,H.roof.curve,H.roof.color,s);m.position.y=ry;rg.add(m)});
    box(rg,L+H.roof.oh*2,.12,.16,0x2b2018,0,ry+H.roof.h+.04,0);
  }
  // extras
  if(H.extras.includes('tebar')||H.extras.includes('tanduk')){
    const eg=part(H.extras.includes('tanduk')?'tanduk':'tebar',[0,2.2,0]);
    const c=H.id==='tiang12'?0xd8b98a:0x6e4a2a;
    [-1,1].forEach(s=>{const tri=gableTri(D/2,H.roof.h,c,s*(L/2));tri.position.y=ry;eg.add(tri);
      for(let i=0;i<6;i++)box(eg,.05,H.roof.h*.6,.05,0x3a2614,s*(L/2+.03),ry+H.roof.h*.3,-D/3+i*(D*2/3)/5);
      if(H.extras.includes('tanduk')){const horn=new THREE.Mesh(new THREE.ConeGeometry(.12,1.2,10),mat(0x2b2018));horn.position.set(s*(L/2+H.roof.oh+.15),ry+H.roof.h+H.roof.curve+.3,0);horn.rotation.z=-s*.5;eg.add(horn)}
      else{[-1,1].forEach(z=>{const len=Math.hypot(D/2+H.roof.oh,H.roof.h)+.2;const b=box(eg,.07,len,.22,0xe0c48f,s*(L/2+H.roof.oh*.9),ry+H.roof.h/2-.05,z*(D/2+H.roof.oh)/2);b.rotation.x=z*Math.atan2(D/2+H.roof.oh,H.roof.h)})}
    })
  }
  if(H.extras.includes('serambi')){
    const sg=part('serambi',[0,.3,2.2]); const sz=D/2+1.3;
    box(sg,3.6,.15,2.6,0x7a5434,0,fy,sz);[-1.7,1.7].forEach(x=>[sz-1.2,sz+1.2].forEach(z=>box(sg,.18,fy+2.2,.18,H.post,x,(fy+2.2)/2,z)));
    box(sg,3.6,.5,.06,H.wall,0,fy+.35,sz+1.3);
    const r=roofSide(3.6,1.4,1,.3,0,H.roof.color,1);r.position.set(0,fy+2.3,sz-1.3);r.scale.z=1.9;sg.add(r);
  }
  if(H.extras.includes('tanggabatu')){
    const tg2=part('tanggabatu',[0,0,2.8]); const tiles=[0x2f7d6d,0xe0a93b,0xc8553d,0x3d6fb0,0xe8e0cf];
    const z0=D/2+2.6,n=5;
    for(let i=0;i<n;i++){const y=(i+1)*fy/(n+.5);box(tg2,1.5,y,0.34,0xf1ebe0,0,y/2,z0+(n-1-i)*.34+.17);box(tg2,1.5,y*.5,.02,tiles[i%5],0,y*.5,z0+(n-1-i)*.34+.35)}
    [-.85,.85].forEach(x=>box(tg2,.2,fy+.3,n*.34,0xf6f1e8,x,(fy+.3)/2,z0+n*.17));
  }
  if(H.longhouse){
    const rg2=part('ruai',[0,.2,1.6]); box(rg2,L,.16,1.8,0x8a6038,0,fy+.01,D/2-.9);
    for(let i=0;i<nx;i++)box(rg2,.12,.12,1.8,0x5a3a20,-L/2+.2+i*(L-.4)/(nx-1),fy-.13,D/2-.9);
    const tj=part('tanju',[0,-.2,3]); box(tj,L*.7,.12,2.4,0xa07a4f,L*.1,fy-.3,D/2+1.3);
    for(let i=0;i<7;i++)[D/2+.3,D/2+2.3].forEach(z=>box(tj,.14,fy-.3,.14,H.post,L*.1-L*.33+i*L*.66/6,(fy-.3)/2,z));
    for(let i=0;i<30;i++)box(tj,.04,.04,2.4,0x5a3a20,L*.1-L*.35+i*L*.7/29,fy-.22,D/2+1.3);
    const bg=part('bilik',[0,1.2,-1]); const nb=6;
    for(let i=1;i<nb;i++)box(bg,.08,wallH,D-1.8,0x6f5235,-L/2+i*L/nb,wy,-0.9);
    for(let i=0;i<nb;i++)box(bg,.8,1.8,.06,0x2e1d10,-L/2+(i+.5)*L/nb,fy+1,D/2-1.84);
  }
  house.traverse(o=>{if(o.isMesh){o.userData.base=o.material.color.getHex()}});
  parts.forEach(g=>g.userData.home=g.position.clone());
  applyExplode(+document.getElementById('explode').value);
  frame(H);
}
function frame(H){const a=viewer.clientWidth/viewer.clientHeight;const d=(Math.max(H.L,8)*1.35+6)*(a<1?1.6/Math.max(a,.5):1);camera.position.set(d*.75,d*.5,d*.9);controls.target.set(0,H.postH+1.8,0);controls.update()}
function applyExplode(v){parts.forEach(g=>g.position.copy(g.userData.home).addScaledVector(g.userData.dir,v))}
function setCut(on){cutOn=on;house.traverse(o=>{if(o.isMesh){o.material.clippingPlanes=on?[clip]:[];o.material.needsUpdate=true}})}
function highlight(key){selected=key;parts.forEach(g=>g.traverse(o=>{if(o.isMesh){o.material.emissive?.setHex(g.userData.key===key?0x6a2a10:0)}}))}

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2(),tip=document.getElementById('tip');let down=null;
function hit(e){const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera);
  const hs=ray.intersectObjects(parts,true).filter(h=>!cutOn||clip.distanceToPoint(h.point)>=0);if(!hs.length)return null;let o=hs[0].object;while(o&&!o.userData.key)o=o.parent;return o?.userData.key}
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const k=hit(e);if(k){const r=viewer.getBoundingClientRect();tip.hidden=false;tip.textContent=P[k][lang][0];tip.style.left=e.clientX-r.left+'px';tip.style.top=e.clientY-r.top+'px';renderer.domElement.style.cursor='pointer'}else{tip.hidden=true;renderer.domElement.style.cursor=''}});
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;const k=hit(e);select(k)});

/* ---------- UI ---------- */
let cur=HOUSES[0];
function select(k){highlight(k);renderPanel()}
function renderPanel(){
  const keys=parts.map(g=>g.userData.key);
  document.getElementById('panel').innerHTML=`<div class="state">${t('region')}: ${cur.state[lang]}</div><h2>${cur.name}</h2><p>${cur.desc[lang]}</p>
  <div class="state" style="margin-top:14px">${t('parts')}</div><div class="parts">${keys.map(k=>`<button class="chip ${k===selected?'on':''}" data-k="${k}">${P[k][lang][0]}</button>`).join('')}</div>
  ${selected?`<div class="part"><div class="t">${cur.name}</div><h3>${P[selected][lang][0]}</h3><p>${P[selected][lang][1]}</p></div>`:`<p style="color:var(--muted);font-size:13px">${t('tap')}</p>`}`;
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>select(b.dataset.k===selected?null:b.dataset.k));
}
function renderPicker(){document.getElementById('picker').innerHTML=HOUSES.map(h=>`<button class="pick ${h===cur?'on':''}" data-id="${h.id}"><b>${h.name}</b><span>${h.state[lang]}</span></button>`).join('');
  document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{cur=HOUSES.find(h=>h.id===b.dataset.id);build(cur);if(cutOn)setCut(true);renderPicker();renderPanel();history.replaceState(null,'','#'+cur.id)})}
function renderText(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=t(e.dataset.i));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  const n=new Set(Object.keys(P)).size;
  document.getElementById('facts').innerHTML=[[HOUSES.length,t('f1')],[HOUSES.length,t('f2')],[n,t('f3')],['✓',t('f4')]].map(([a,b])=>`<div class="fact"><b>${a}</b><span>${b}</span></div>`).join('');
  renderPicker();renderPanel()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;localStorage.setItem('lang',lang);renderText()});
document.getElementById('explode').oninput=e=>applyExplode(+e.target.value);
document.getElementById('cut').onclick=e=>{setCut(!cutOn);e.currentTarget.classList.toggle('on',cutOn)};
document.getElementById('spin').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.classList.toggle('on',controls.autoRotate)};
document.getElementById('reset').onclick=()=>{document.getElementById('explode').value=0;applyExplode(0);if(cutOn){setCut(false);document.getElementById('cut').classList.remove('on')}highlight(null);renderPanel();frame(cur)};

function resize(){const w=viewer.clientWidth,h=viewer.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(viewer);
cur=HOUSES.find(h=>'#'+h.id===location.hash)||HOUSES[0];
resize();build(cur);renderText();document.getElementById('loading').remove();
controls.autoRotateSpeed=1.2;
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
</body>
</html>
